<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:)</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; }
        #background {
            position: absolute; inset: 0;
            background-image: url('wallpaper.png');
            background-size: auto;
            background-repeat: repeat;
            background-position: center;
            display: flex; justify-content: center; align-items: center;
        }
        #movingImage { position: absolute; top: 0; left: 0; width: 150px; height: 150px; }
        #centerText {
            position: absolute; font-size: 3em; color: #fff; text-align: center;
            font-family: Arial, sans-serif; text-shadow: 0 2px 12px rgba(0,0,0,.6);
            padding: 0 1rem;
        }
    </style>
</head>
<body>
    <div id="background">
        <div id="centerText">Try to click on doigdrip (this is possible)</div>
        <div id="container">
            <a href="https://www.youtube.com/watch?v=8P5WCI0iQlo">
                <img id="movingImage" src="doigdrip.jpg" alt="Moving image">
            </a>
        </div>
    </div>
    <script>
        var img = document.getElementById('movingImage');
        var dx = 5, dy = 5;

        function moveImage() {
            var x = img.offsetLeft, y = img.offsetTop;
            if (x + dx > window.innerWidth - img.width || x + dx < 0) dx = -dx;
            if (y + dy > window.innerHeight - img.height || y + dy < 0) dy = -dy;
            img.style.left = x + dx + 'px';
            img.style.top = y + dy + 'px';
            requestAnimationFrame(moveImage);
        }
        img.addEventListener('mouseover', function () {
            img.style.left = Math.random() * (window.innerWidth - img.width) + 'px';
            img.style.top = Math.random() * (window.innerHeight - img.height) + 'px';
        });
        window.onload = moveImage;
    </script>
</body>
</html>
