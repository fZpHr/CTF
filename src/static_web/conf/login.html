<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace client · Datalys</title>
    <meta name="description" content="Connectez-vous à votre espace client Datalys.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
</head>
<body data-page="">
    <main>
        <section style="padding:72px 0">
            <div class="container">
                <div class="card form-card">
                    <div style="text-align:center;margin-bottom:1.4rem">
                        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true" style="width:42px;height:42px;margin:0 auto .6rem">
                            <rect width="32" height="32" rx="8" fill="#2563eb"/>
                            <rect x="8" y="16" width="4" height="8" rx="1" fill="#ffffff"/>
                            <rect x="14" y="11" width="4" height="13" rx="1" fill="#9ad5ff"/>
                            <rect x="20" y="7" width="4" height="17" rx="1" fill="#06b6d4"/>
                        </svg>
                        <h2 style="margin:0">Espace client</h2>
                        <p class="muted" style="margin:.3rem 0 0">Accédez à vos tableaux de bord Datalys.</p>
                    </div>
                    <p id="loginMsg" class="msg"></p>
                    <form id="loginForm" action="/login" method="post">
                        <label for="username">Identifiant</label>
                        <input type="text" id="username" name="username" autocomplete="username" required>
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <button class="btn btn-primary" type="submit">Se connecter</button>
                    </form>
                    <p class="muted" style="text-align:center;margin:1rem 0 0;font-size:.9rem">
                        <a href="build">Mot de passe oublié ?</a> · <a href="contact">Besoin d'un accès ?</a>
                    </p>
                </div>
            </div>
        </section>
    </main>
    <script src="partials.js"></script>
    <script src="prank.js"></script>
    <script>
        DatalysPrank.attach(document.getElementById('loginForm'), {
            flow: 'login', msgSel: '#loginMsg', userSel: '#username', passSel: '#password'
        });
    </script>
</body>
</html>
